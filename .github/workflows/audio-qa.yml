# ============================================================================
# audio-qa.yml — Audio QA Gate CI Workflow (SESSION-007)
# ============================================================================
#
# TEACHING NOTE — Automated Audio Quality Gate
# --------------------------------------------
# In a professional audio pipeline, generated audio assets should be validated
# automatically on every change to ensure they meet loudness, clipping, and
# loop-quality targets before they can be promoted.
#
# What this workflow does:
#   1. Installs the audio-engine Python package (with OGG support).
#   2. Generates SFX, full-length music, and voice batches from committed
#      fixtures into /tmp.
#   3. Runs `qa-batch` over each generated batch and fails CI when any file
#      misses QA thresholds.
#   4. Uploads generated audio and QA reports as workflow artifacts so
#      developers can listen to results directly from the Actions run.
#   5. Uses `if: always()` on artifact uploads so failed QA runs still provide
#      downloadable audio for diagnosis. Artifact retention is 14 days.
#
# Trigger: any push or pull-request that touches audio engine source, tests,
#           generation request fixtures, or this workflow file itself.
#
# On success: job passes, PR can be merged.
# On failure: job fails with a per-file QA report so the author knows
#             exactly which thresholds were exceeded.
# ============================================================================

name: Audio QA Gate

on:
  push:
    paths:
      - 'audio_engine/**'
      - 'tests/**'
      - 'docs/AI_FACTORY/EXAMPLES/**'
      - '.github/workflows/audio-qa.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'audio_engine/**'
      - 'tests/**'
      - 'docs/AI_FACTORY/EXAMPLES/**'
      - '.github/workflows/audio-qa.yml'
      - 'pyproject.toml'
  # Allow manual trigger from the GitHub Actions UI.
  workflow_dispatch:

# TEACHING NOTE — Principle of Least Privilege
# Grant only the minimum permissions required.
permissions:
  contents: read

jobs:
  audio-qa:
    name: Generate and QA-gate music, SFX, and voice assets
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -----------------------------------------------------------------------
      # 3. Install the audio-engine package in editable mode with dev extras
      # -----------------------------------------------------------------------
      - name: Install audio-engine
        run: pip install -e ".[dev,ogg]"

      # -----------------------------------------------------------------------
      # 4. Run the full test suite (includes unit and integration tests)
      # -----------------------------------------------------------------------
      - name: Run pytest
        run: python -m pytest --tb=short -q

      # -----------------------------------------------------------------------
      # 5. Generate a small SFX batch from the committed fixture
      #    The SFX fixture is fast to execute and has no optional dependencies,
      #    making it a reliable smoke target in CI.
      # -----------------------------------------------------------------------
      - name: Generate SFX batch (committed fixture)
        run: |
          audio-engine generate-request-batch \
            --batch-file docs/AI_FACTORY/EXAMPLES/gamerewritten_vertical_slice/generation_requests.sfx.v1.json \
            --output-dir /tmp/ci_qa_batch \
            --quiet

      # -----------------------------------------------------------------------
      # 6. Run the QA gate over the generated SFX files
      #    The command exits non-zero if any file fails loudness, peak, or
      #    clipping checks — this fails the CI step.
      # -----------------------------------------------------------------------
      - name: Run QA gate on generated SFX
        run: |
          audio-engine qa-batch \
            --input-dir /tmp/ci_qa_batch/drafts/sfx \
            --output-report /tmp/ci_qa_batch/qa_report.json \
            --recursive \
            || (echo "QA gate failed — see report below:" && \
                python -m json.tool /tmp/ci_qa_batch/qa_report.json && \
                exit 1)

      # -----------------------------------------------------------------------
      # 7. Generate a full-length music batch from the committed fixture
      #    Do not cap duration: this fixture intentionally validates complete
      #    compositions at natural durations.
      # -----------------------------------------------------------------------
      - name: Generate music batch (full length)
        run: |
          audio-engine generate-request-batch \
            --batch-file docs/AI_FACTORY/EXAMPLES/gamerewritten_vertical_slice/generation_requests.music.v1.json \
            --output-dir /tmp/ci_qa_music \
            --quiet

      # -----------------------------------------------------------------------
      # 8. Run the QA gate over generated music files
      # -----------------------------------------------------------------------
      - name: Run QA gate on generated music
        run: |
          audio-engine qa-batch \
            --input-dir /tmp/ci_qa_music/drafts/music \
            --output-report /tmp/ci_qa_music/qa_report.json \
            --recursive \
            || (echo "QA gate failed — see report below:" && \
                python -m json.tool /tmp/ci_qa_music/qa_report.json && \
                exit 1)

      # -----------------------------------------------------------------------
      # 9. Generate a voice batch from the committed fixture
      # -----------------------------------------------------------------------
      - name: Generate voice batch
        run: |
          audio-engine generate-request-batch \
            --batch-file docs/AI_FACTORY/EXAMPLES/gamerewritten_vertical_slice/generation_requests.voice.v1.json \
            --output-dir /tmp/ci_qa_voice \
            --quiet

      # -----------------------------------------------------------------------
      # 10. Run the QA gate over generated voice files
      # -----------------------------------------------------------------------
      - name: Run QA gate on generated voice
        run: |
          audio-engine qa-batch \
            --input-dir /tmp/ci_qa_voice/drafts/voice \
            --output-report /tmp/ci_qa_voice/qa_report.json \
            --recursive \
            || (echo "QA gate failed — see report below:" && \
                python -m json.tool /tmp/ci_qa_voice/qa_report.json && \
                exit 1)

      # -----------------------------------------------------------------------
      # 11-14. Upload generated audio + QA reports as retained artifacts
      # -----------------------------------------------------------------------
      - name: Upload SFX audio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-qa-sfx
          path: /tmp/ci_qa_batch/drafts/sfx/**
          retention-days: 14

      - name: Upload music audio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-qa-music
          path: /tmp/ci_qa_music/drafts/music/**
          retention-days: 14

      - name: Upload voice audio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-qa-voice
          path: /tmp/ci_qa_voice/drafts/voice/**
          retention-days: 14

      - name: Upload QA reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-qa-reports
          path: |
            /tmp/ci_qa_batch/qa_report.json
            /tmp/ci_qa_music/qa_report.json
            /tmp/ci_qa_voice/qa_report.json
          retention-days: 14
