# License compliance policy for the Audio-Engine package.
#
# This file is the single source of truth for license enforcement.
# Audio-engine's CI gate (audio-engine check-licenses) reads this file
# to decide which SPDX license identifiers are allowed, conditional, or blocked.
#
# Sections:
#   allow       — unrestricted; all commercial and non-commercial use OK
#   conditional — permitted under specific conditions (attribution etc.)
#                 The "notes" field explains the conditions.
#   block       — not permitted for commercial use; CI will exit non-zero
#
# Adding new dependencies:
#   1. Find the SPDX identifier for the new package.
#   2. Add it to the correct section below.
#   3. Run `audio-engine check-licenses` to confirm CI would pass.
#   4. Cross-check docs/AI_FACTORY/LICENSE_INVENTORY.md.

[allow]
"BSD-3-Clause" = "Permissive — full commercial use permitted"
"BSD-2-Clause" = "Permissive — full commercial use permitted"
"MIT"           = "Permissive — full commercial use permitted"
"Apache-2.0"    = "Permissive — full commercial use permitted"
"PSF-2.0"       = "Python Software Foundation — full commercial use permitted"
"ISC"           = "Permissive — full commercial use permitted"
"Unlicense"     = "Public domain — full commercial use permitted"
"CC0-1.0"       = "Public domain — full commercial use permitted"
"LGPL-2.1-only"     = "LGPL — dynamic-link commercial use permitted with attribution"
"LGPL-3.0-only"     = "LGPL — dynamic-link commercial use permitted with attribution"
"LGPL-2.1-or-later" = "LGPL — dynamic-link commercial use permitted with attribution"
"LGPL-3.0-or-later" = "LGPL — dynamic-link commercial use permitted with attribution"

[conditional]
"GPL-2.0"  = "Attribution + must share modifications; commercial use may be allowed — verify"
"GPL-3.0"  = "Attribution + must share modifications; commercial use may be allowed — verify"
"EUPL-1.2" = "EU Public Licence — compatible with GPL; verify commercial use"
"MPL-2.0"  = "Mozilla — commercial use permitted if modifications are open-sourced"

[block]
"CC-BY-NC-4.0"    = "Creative Commons Non-Commercial — prohibits commercial use"
"CC-BY-NC-SA-4.0" = "Creative Commons Non-Commercial ShareAlike — prohibits commercial use"
"AGPL-3.0"        = "AGPL — network-use copyleft; blocks commercial SaaS use"
"SSPL-1.0"        = "Server Side Public License — effectively prohibits most commercial use"
